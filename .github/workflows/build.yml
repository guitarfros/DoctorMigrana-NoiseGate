name: Build

# Compila en Linux, Windows e macOS en cada push/PR.
# Para publicar unha Release cos ZIP: crea e sube unha etiqueta que empece por "v":
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,   os: ubuntu-24.04 }
          - { name: Windows, os: windows-latest }
          - { name: macOS,   os: macos-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Dependencias (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev

      # As arquitecturas de macOS (arm64;x86_64) xa van en CMakeLists.txt: así o «;»
      # non pasa polo shell e non hai que poñer aspas.
      - name: Configurar
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCALMA_COPY_AFTER_BUILD=OFF

      - name: Compilar
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Tests do DSP
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Empaquetar
        shell: bash
        run: |
          set -euo pipefail
          ART="build/DoctorMigranaNoiseGate_artefacts/Release"
          ls -R "$ART"
          mkdir -p dist
          cp -R "$ART/VST3" dist/VST3
          cp -R "$ART/Standalone" dist/Standalone
          cp LICENSE README.md NOTICE.md dist/
          # Nome sen espazos: GitHub cambia os espazos dos ficheiros das Releases por puntos
          (cd dist && cmake -E tar cf "../Doctor-Migrana-Noise-Gate-${{ matrix.name }}.zip" --format=zip .)
          ls -l Doctor-Migrana-Noise-Gate-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Doctor-Migrana-Noise-Gate-${{ matrix.name }}
          path: Doctor-Migrana-Noise-Gate-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    name: Publicar release
    # Só co tag «v*» e só se os TRES builds acabaron ben
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Ficheiros que se van publicar
        run: ls -l artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
